<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ôn Trắc Nghiệm (By ChanhDo)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #4361ee; --p-hover: #3730a3; --s: #10b981; 
            --d: #ef4444; --bg: #f0f2f5; --card-bg: #ffffff;
            --text-main: #1e293b; --radius: 16px;
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: var(--bg); color: var(--text-main);
            line-height: 1.5; -webkit-tap-highlight-color: transparent;
        }

        @keyframes modalShow { 
            from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); } 
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); } 
        }
        @keyframes backdropBlur {
            from { backdrop-filter: blur(0px); background: rgba(0,0,0,0); }
            to { backdrop-filter: blur(8px); background: rgba(0,0,0,0.4); }
        }

        .topbar { 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px);
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.03); position: sticky; top: 0; z-index: 1000; 
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .logo { font-weight: 800; color: var(--p); font-size: 1.1rem; line-height: 1.1; }

        button { 
            padding: 10px 16px; border: none; border-radius: var(--radius); 
            cursor: pointer; font-weight: 700; font-size: 0.85rem;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px;
            justify-content: center;
        }
        button:active { transform: scale(0.95); }

        .btn-p { background: var(--p); color: white; }
        .btn-g { background: #ffffff; color: #475569; border: 1px solid #e2e8f0; }
        .btn-s { background: var(--s); color: white; }
        .btn-del { color: var(--d); background: #fee2e2; }
        .btn-orange { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
        .btn-blue { background: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }
        
        .btn-func-edit { background: #fff7ed; color: #d97706; border: 1px solid #fde68a; }
        .btn-func-mode { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }
        .btn-func-name { background: #ecfeff; color: #0891b2; border: 1px solid #cffafe; }
        .btn-func-json { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .btn-func-share { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }

        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        #examGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); gap: 20px; }
        @media (min-width: 600px) { #examGrid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }

        .card { 
            background: var(--card-bg); padding: 25px; 
            border-radius: 24px; border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.02); transition: 0.3s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--p); }
        .card b { font-size: 1.2rem; display: block; margin-bottom: 15px; }
        .card-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .card-actions .btn-start { grid-column: span 2; padding: 14px; font-size: 1rem; background: var(--p); color: white; }

        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2500; display: none;
            animation: backdropBlur 0.3s forwards;
        }
        .popup { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 30px; border-radius: 30px; 
            display: none; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); 
            z-index: 3000; width: 90%; max-width: 450px;
            animation: modalShow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .popup h3 { text-align: center; margin-top: 0; margin-bottom: 15px; font-size: 1.25rem; }

        .overlay { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 2000; }
        .ov-header { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: relative; }
        .progress-bar { height: 4px; background: var(--p); width: 0%; position: absolute; bottom: 0; left: 0; transition: 0.3s; }

        .content { flex: 1; display: flex; flex-direction: column; padding: 20px; align-items: center; overflow-y: auto; }
        .q-box { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }

        .input-text { width: 100%; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; margin-bottom: 12px; outline: none; font-size: 1rem; box-sizing: border-box; transition: 0.2s; text-align: center;}
        .required-field { border: 2px solid var(--d) !important; background: #fffafb; }
        
        input[type="radio"] { 
            appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50% !important; 
            background: #fff; cursor: pointer; display: inline-block; vertical-align: middle; position: relative;
        }
        .radio-required { border: 2px solid var(--d); }
        .radio-normal { border: 2px solid #cbd5e1; }
        input[type="radio"]:checked { background: var(--p); border-color: var(--p); }
        input[type="radio"]:checked::after { content: ''; position: absolute; top: 5px; left: 5px; width: 8px; height: 8px; background: white; border-radius: 50%; }

        .img-area { width: 100%; height: 180px; border: 2px dashed #cbd5e1; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 15px; overflow: hidden; background: #f8fafc; }
        .img-area img { width: 100%; height: 100%; object-fit: contain; }

        .opt-edit-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; background: #f8fafc; padding: 10px; border-radius: 15px; border: 1px solid #e2e8f0; }
        .opt-img-mini { width: 60px; height: 60px; border-radius: 10px; border: 1px solid #cbd5e1; cursor: pointer; display: flex; align-items: center; justify-content: center; background: white; overflow: hidden; font-size: 1.2rem; }
        .opt-img-mini img { width: 100%; height: 100%; object-fit: cover; }

        .opt-quiz { padding: 16px 20px; border: 2px solid #f1f5f9; border-radius: 18px; margin-bottom: 12px; cursor: pointer; font-weight: 600; background: #fff; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;}
        .opt-quiz img { max-width: 100%; max-height: 150px; border-radius: 10px; }
        .correct { background: #dcfce7 !important; border-color: var(--s) !important; color: #065f46 !important; }
        .wrong { background: #fee2e2 !important; border-color: var(--d) !important; color: #991b1b !important; }
        .switch-label { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo">ÔN TRẮC NGHIỆM<br><span style="font-size:0.6rem; color:#64748b; font-weight:400">By ChanhDo</span></div>
    <div class="header-actions" style="display:flex; gap:5px">
        <button class="btn-g" onclick="document.getElementById('fileIn').click()">📂 Tải JSON</button>
        <button class="btn-p" onclick="openPopup('createPopup')">✨ Tạo Đề</button>
    </div>
    <input type="file" id="fileIn" hidden accept=".json" multiple>
</div>

<div class="container">
    <div id="examGrid"></div>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="closeAllPopups()"></div>

<div id="createPopup" class="popup">
    <h3>Tên đề mới</h3>
    <input type="text" id="createNameInput" class="input-text" placeholder="Nhập tên đề...">
    <button class="btn-p" style="width:100%" onclick="confirmCreate()">Tiếp theo</button>
</div>

<div id="alertPopup" class="popup">
    <div style="text-align:center; margin-bottom:15px">
        <div style="background:#fef2f2; width:50px; height:50px; border-radius:15px; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; color:var(--d); font-size:1.2rem">⚠️</div>
        <h3 id="alertTitle" style="margin:0">Thông báo</h3>
    </div>
    <p id="alertMsg" style="text-align:center; color:#64748b; font-size:0.9rem; margin-bottom:20px"></p>
    <button class="btn-p" style="width:100%" onclick="closeAllPopups()">Đã hiểu</button>
</div>

<!-- Popup Chia Sẻ -->
<div id="sharePopup" class="popup">
    <div style="text-align:center; margin-bottom:15px">
        <div style="background:#f0f9ff; width:50px; height:50px; border-radius:15px; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; color:var(--p); font-size:1.2rem">🔗</div>
        <h3>Chia Sẻ Đề Thi</h3>
    </div>
    <p style="font-size:0.85rem; color:#64748b; margin-bottom:10px">Liên kết chia sẻ:</p>
    <textarea id="shareLinkDisplay" class="input-text" style="font-size:0.8rem; height:80px; text-align:left; background:#f8fafc; word-break: break-all;" readonly placeholder="Đang tạo link..."></textarea>
    <div id="shortenStatus" style="font-size:0.75rem; color:var(--p); text-align:center; margin-bottom:10px; min-height:1rem"></div>
    <button class="btn-p" style="width:100%" onclick="copyShareLink()">Sao chép liên kết</button>
</div>

<div id="setPopup" class="popup">
    <h3>Chế Độ</h3>
    <label class="switch-label"><b>Trộn câu hỏi</b> <input type="checkbox" id="shufQ" style="width:20px; height:20px"></label>
    <label class="switch-label"><b>Trộn đáp án</b> <input type="checkbox" id="shufA" style="width:20px; height:20px"></label>
    <div style="padding-top:15px">
        <b style="font-size:0.85rem; color:#64748b">THỜI GIAN (PHÚT)</b>
        <input type="number" id="timeLimit" class="input-text" min="0" placeholder="0 = Không giới hạn">
    </div>
    <button class="btn-p" style="width:100%" onclick="applySettings()">Áp dụng</button>
</div>

<div id="renamePopup" class="popup">
    <h3>Đổi tên</h3>
    <input type="text" id="newNameInput" class="input-text" placeholder="Nhập tên mới...">
    <button class="btn-p" style="width:100%" onclick="confirmRename()">Cập nhật</button>
</div>

<div id="deletePopup" class="popup">
    <h3>Xác nhận xóa?</h3>
    <p style="text-align:center; color:#64748b; margin-bottom:20px; font-size:0.9rem">Dữ liệu sẽ mất vĩnh viễn.</p>
    <div style="display:flex; gap:10px">
        <button class="btn-g" style="flex:1" onclick="closeAllPopups()">Hủy</button>
        <button class="btn-del" style="flex:1; background:var(--d); color:white" onclick="confirmDelete()">Xóa</button>
    </div>
</div>

<div id="exitConfirmPopup" class="popup">
    <h3 id="exitTitle">Thoát?</h3>
    <p id="exitMsg" style="text-align:center; color:#64748b; margin-bottom:20px; font-size:0.9rem">Mọi thay đổi chưa lưu sẽ bị hủy bỏ.</p>
    <div style="display:flex; gap:10px">
        <button class="btn-g" style="flex:1" onclick="closeAllPopups()">Ở lại</button>
        <button class="btn-del" style="flex:1; background:var(--d); color:white" onclick="forceExit()">Thoát</button>
    </div>
</div>

<div id="mainOverlay" class="overlay">
    <div class="ov-header">
        <div id="timerDisplay" style="font-weight:800; color:var(--d); background:#fee2e2; padding:4px 12px; border-radius:50px; display:none">00:00</div>
        <div id="ovTitle" style="font-weight:800; font-size:0.9rem">Đang soạn thảo</div>
        <div style="display:flex; gap:8px">
            <button id="saveBtn" class="btn-s" onclick="saveEditor()">Lưu</button>
            <button class="btn-g" onclick="handleExitRequest()">Thoát</button>
        </div>
        <div id="pBar" class="progress-bar"></div>
    </div>
    <div class="content">
        <div class="q-box" id="mainContent"></div>
        <div id="navArea" style="display:flex; gap:10px; margin-top:15px; width:100%; max-width:600px;">
            <button id="btnPrev" style="flex:1" class="btn-g" onclick="nav(-1)">Quay lại</button>
            <button id="btnNext" style="flex:1" class="btn-p" onclick="nav(1)">Kế tiếp</button>
        </div>
        <p id="pageInfo"></p>
    </div>
</div>

<script>
    const STORAGE_KEY = "QUIZ_APP_CHANHDO_2026_V2";
    let exams = [];
    let currentDraft = null; 
    let isEditingNew = false; 
    let curExIdx = -1;
    let curQIdx = 0;
    let timerInterval = null;
    let isQuizMode = false;
    let quizData = [];
    let score = 0;
    let answeredCount = 0;
    let originalQuizLength = 0;

    function sync() { localStorage.setItem(STORAGE_KEY, JSON.stringify(exams)); }
    
    function load() { 
        const d = localStorage.getItem(STORAGE_KEY); 
        if(d) exams = JSON.parse(d); 
        checkSharedLink(); 
        renderExams();
    }

    async function openShare(i) {
        const examData = exams[i];
        document.getElementById('shareLinkDisplay').value = "Đang xử lý dữ liệu...";
        document.getElementById('shortenStatus').innerText = "⏳ Đang nén và tạo link rút gọn...";
        openPopup('sharePopup');

        try {
            const jsonStr = JSON.stringify(examData);
            const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
            const fullUrl = window.location.origin + window.location.pathname + "?share=" + base64;
            
            // Cập nhật link dài trước phòng khi API lỗi
            document.getElementById('shareLinkDisplay').value = fullUrl;

            // Gọi API rút gọn link (is.gd)
            try {
                const response = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(fullUrl)}`);
                const data = await response.json();
                
                if (data.shorturl) {
                    document.getElementById('shareLinkDisplay').value = data.shorturl;
                    document.getElementById('shortenStatus').innerText = "✅ Đã rút gọn thành công!";
                    document.getElementById('shortenStatus').style.color = "var(--s)";
                } else {
                    throw new Error("API limit");
                }
            } catch (apiErr) {
                document.getElementById('shortenStatus').innerText = "⚠️ Không thể rút gọn (Link quá dài), hãy dùng file JSON.";
                document.getElementById('shortenStatus').style.color = "var(--d)";
            }

        } catch (e) {
            document.getElementById('shareLinkDisplay').value = "LỖI: Đề quá lớn!";
            showAlert("Đề thi này chứa quá nhiều dữ liệu ảnh, không thể tạo link. Hãy dùng tính năng Xuất JSON.");
        }
    }

    function copyShareLink() {
        const link = document.getElementById("shareLinkDisplay");
        if(link.value.startsWith("http")) {
            link.select();
            document.execCommand("copy");
            alert("Đã sao chép liên kết!");
        } else {
            alert("Chưa có liên kết để sao chép!");
        }
    }

    function checkSharedLink() {
        const urlParams = new URLSearchParams(window.location.search);
        const shareData = urlParams.get('share');
        if (shareData) {
            try {
                const jsonStr = decodeURIComponent(escape(atob(shareData)));
                const sharedExam = JSON.parse(jsonStr);
                let finalName = sharedExam.name;
                let count = 1;
                while(exams.some(ex => ex.name === finalName)) {
                    finalName = sharedExam.name + " (Nhận " + count + ")";
                    count++;
                }
                sharedExam.name = finalName;
                exams.push(sharedExam);
                sync();
                window.history.replaceState({}, document.title, window.location.pathname);
                setTimeout(() => {
                    showAlert("Hệ thống đã tự động thêm đề: " + finalName);
                }, 500);
            } catch (e) {
                console.error("Link chia sẻ không hợp lệ");
            }
        }
    }

    function openPopup(id) {
        document.getElementById('modalBackdrop').style.display = 'block';
        document.getElementById(id).style.display = 'block';
    }

    function closeAllPopups() { 
        document.getElementById('modalBackdrop').style.display = 'none'; 
        document.querySelectorAll('.popup').forEach(p => p.style.display = 'none'); 
    }

    function showAlert(msg) { 
        document.getElementById('alertMsg').innerText = msg; 
        openPopup('alertPopup');
    }

    function exportExam(i) {
        const data = JSON.stringify(exams[i].questions, null, 2);
        const blob = new Blob([data], {type: "application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${exams[i].name}.json`;
        a.click();
    }

    function confirmCreate() {
        const name = document.getElementById('createNameInput').value.trim();
        if(!name) return showAlert("Vui lòng nhập tên đề!");
        if(exams.some(ex => ex.name.toLowerCase() === name.toLowerCase())) return showAlert("Tên đã tồn tại!");
        currentDraft = { 
            name, 
            questions: [{question:"", options:[{text:"", image:""},{text:"", image:""}], answer:"", image:""}], 
            settings: {shufQ:false, shufA:false, time:0} 
        };
        isEditingNew = true; curQIdx = 0; isQuizMode = false;
        closeAllPopups();
        document.getElementById('createNameInput').value = "";
        openEditorUI();
    }

    function openEditor(i) {
        curExIdx = i; isEditingNew = false; isQuizMode = false;
        currentDraft = JSON.parse(JSON.stringify(exams[i]));
        curQIdx = 0; openEditorUI();
    }

    function openEditorUI() {
        document.getElementById('mainOverlay').style.display = 'flex';
        document.getElementById('ovTitle').innerText = "Soạn thảo: " + currentDraft.name;
        document.getElementById('saveBtn').style.display = 'block';
        document.getElementById('navArea').style.display = 'flex';
        renderEditPage();
    }

    function renderEditPage() {
        const q = currentDraft.questions[curQIdx];
        document.getElementById('mainContent').innerHTML = `
            <div class="img-area" onclick="document.getElementById('fImg').click()">
                ${q.image ? `<img src="${q.image}">` : '<span>📷 Thêm ảnh câu hỏi</span>'}
                <input type="file" id="fImg" hidden accept="image/*" onchange="uploadImg(this, -1)">
            </div>
            <textarea class="input-text ${!q.question ? 'required-field' : ''}" style="height:80px; text-align:left" placeholder="Nội dung câu hỏi..." oninput="updQ(this)">${q.question}</textarea>
            <div id="optList">
                ${q.options.map((o, i) => `
                    <div class="opt-edit-row">
                        <div style="display:flex; gap:10px; align-items:center">
                            <input type="radio" name="ans" class="${!q.answer ? 'radio-required' : 'radio-normal'}" ${q.answer === o.text && o.text !== "" ? 'checked' : ''} onchange="setA(${i})">
                            <input type="text" class="input-text ${!o.text ? 'required-field' : ''}" style="margin:0; flex:1; text-align:left" value="${o.text}" placeholder="Đáp án ${i+1}" oninput="updO(${i}, this)">
                            <button class="btn-del" style="background:none; padding:5px" onclick="delO(${i})">✕</button>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px; margin-top:5px">
                            <div class="opt-img-mini" onclick="document.getElementById('fImgOpt${i}').click()">
                                ${o.image ? `<img src="${o.image}">` : '📷'}
                            </div>
                            <span style="font-size:0.7rem; color:#64748b">${o.image ? 'Đã có ảnh' : 'Thêm ảnh đáp án'}</span>
                            <input type="file" id="fImgOpt${i}" hidden accept="image/*" onchange="uploadImg(this, ${i})">
                            ${o.image ? `<button class="btn-del" style="font-size:0.6rem; padding:4px 8px" onclick="removeOptImg(${i})">Xóa ảnh</button>` : ''}
                        </div>
                    </div>
                `).join('')}
            </div>
            <button onclick="addO()" style="width:100%; margin-top:10px; background:#f1f5f9; color:var(--p); padding:12px; border-radius:12px">+ Thêm đáp án</button>
        `;
        document.getElementById('btnPrev').disabled = (curQIdx === 0);
        document.getElementById('btnNext').innerText = (curQIdx === currentDraft.questions.length - 1) ? "Câu mới +" : "Kế tiếp";
        document.getElementById('pageInfo').innerText = `Câu ${curQIdx + 1} / ${currentDraft.questions.length}`;
    }

    function nav(step) {
        if(step === 1 && curQIdx === currentDraft.questions.length - 1) {
            currentDraft.questions.push({question:"", options:[{text:"", image:""},{text:"", image:""}], answer:"", image:""});
        }
        curQIdx += step; renderEditPage();
    }

    function updQ(el) { currentDraft.questions[curQIdx].question = el.value; el.classList.toggle('required-field', !el.value.trim()); }
    function updO(i, el) { currentDraft.questions[curQIdx].options[i].text = el.value; el.classList.toggle('required-field', !el.value.trim()); }
    function setA(i) { currentDraft.questions[curQIdx].answer = currentDraft.questions[curQIdx].options[i].text; renderEditPage(); }
    function addO() { currentDraft.questions[curQIdx].options.push({text:"", image:""}); renderEditPage(); }
    function delO(i) { if(currentDraft.questions[curQIdx].options.length > 2) { currentDraft.questions[curQIdx].options.splice(i, 1); renderEditPage(); } }
    function removeOptImg(i) { currentDraft.questions[curQIdx].options[i].image = ""; renderEditPage(); }

    function saveEditor() {
        currentDraft.questions = currentDraft.questions.filter(q => {
            const isEmpty = q.question.trim() === "" && q.options.every(o => o.text.trim() === "") && q.answer === "" && q.image === "";
            return !isEmpty;
        });
        for(let j=0; j < currentDraft.questions.length; j++) {
            const q = currentDraft.questions[j];
            const hasQ = q.question.trim() !== "";
            const hasAllOpts = q.options.length >= 2 && q.options.every(o => o.text.trim() !== "");
            const hasAns = q.answer !== "" && q.options.some(o => o.text === q.answer);
            if(!hasQ || !hasAllOpts || !hasAns) {
                curQIdx = j; renderEditPage();
                if(!hasQ) showAlert(`Câu ${j+1} bị thiếu nội dung câu hỏi!`);
                else if(!hasAllOpts) showAlert(`Câu ${j+1} bị thiếu nội dung đáp án!`);
                else showAlert(`Câu ${j+1} chưa chọn đáp án đúng!`);
                return;
            }
        }
        if(currentDraft.questions.length < 1) return showAlert("Đề thi cần ít nhất 1 câu hỏi!");
        if(isEditingNew) exams.push(currentDraft); else exams[curExIdx] = currentDraft;
        sync(); renderExams(); currentDraft = null; 
        document.getElementById('mainOverlay').style.display = 'none';
    }

    function handleExitRequest() {
        document.getElementById('exitTitle').innerText = isQuizMode ? "Dừng làm bài?" : "Thoát soạn thảo?";
        openPopup('exitConfirmPopup');
    }

    function forceExit() {
        clearInterval(timerInterval);
        currentDraft = null;
        document.getElementById('mainOverlay').style.display = 'none';
        closeAllPopups();
    }

    function startQuiz(i) {
        curExIdx = i; isQuizMode = true; curQIdx = 0; score = 0; answeredCount = 0;
        const ex = exams[i];
        quizData = JSON.parse(JSON.stringify(ex.questions));
        originalQuizLength = quizData.length;
        if(ex.settings.shufQ) quizData.sort(() => Math.random() - 0.5);
        if(ex.settings.shufA) quizData.forEach(q => q.options.sort(() => Math.random() - 0.5));
        document.getElementById('mainOverlay').style.display = 'flex';
        document.getElementById('saveBtn').style.display = 'none';
        document.getElementById('navArea').style.display = 'none';
        document.getElementById('ovTitle').innerText = ex.name;
        clearInterval(timerInterval);
        if(ex.settings.time > 0) {
            document.getElementById('timerDisplay').style.display = 'block';
            let sec = ex.settings.time * 60;
            timerInterval = setInterval(() => {
                let m = Math.floor(sec/60), s = sec%60;
                document.getElementById('timerDisplay').innerText = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                if(sec-- <= 0) { clearInterval(timerInterval); finishQuiz(); }
            }, 1000);
        } else document.getElementById('timerDisplay').style.display = 'none';
        showQuizQ();
    }

    function showQuizQ() {
        if(answeredCount >= originalQuizLength) return finishQuiz();
        const q = quizData[curQIdx];
        document.getElementById('pBar').style.width = (answeredCount/originalQuizLength*100) + "%";
        document.getElementById('pageInfo').innerText = `TIẾN ĐỘ: ${answeredCount} / ${originalQuizLength}`;
        document.getElementById('mainContent').innerHTML = `
            ${q.image ? `<img src="${q.image}" style="width:100%; max-height:200px; object-fit:contain; border-radius:15px; margin-bottom:15px">` : ''}
            <h2 style="margin-bottom:20px; font-size:1.1rem; text-align:center">${q.question}</h2>
            <div style="display:grid; gap:12px">
                ${q.options.map(o => `
                    <div class="opt-quiz" onclick="checkA(this, '${o.text.replace(/'/g, "\\'")}', '${q.answer.replace(/'/g, "\\'")}')">
                        ${o.image ? `<img src="${o.image}">` : ''}
                        <span>${o.text}</span>
                    </div>
                `).join('')}
            </div>
            <button class="btn-orange" style="width:100%; margin-top:20px; padding:12px" onclick="skipQ()">Bỏ qua câu này</button>
        `;
    }

    function checkA(el, val, correct) {
        document.querySelectorAll('.opt-quiz').forEach(o => o.style.pointerEvents = 'none');
        if(val === correct) { el.classList.add('correct'); score++; }
        else { 
            el.classList.add('wrong'); 
            document.querySelectorAll('.opt-quiz').forEach(o => {
                if(o.querySelector('span').innerText === correct) o.classList.add('correct');
            });
        }
        answeredCount++;
        setTimeout(() => { 
            quizData.splice(curQIdx, 1); 
            if(curQIdx >= quizData.length) curQIdx = 0; 
            showQuizQ(); 
        }, 1200);
    }

    function skipQ() {
        let q = quizData.splice(curQIdx, 1)[0]; quizData.push(q);
        if(curQIdx >= quizData.length) curQIdx = 0; showQuizQ();
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById('pBar').style.width = "100%";
        document.getElementById('mainContent').innerHTML = `
            <div style="text-align:center; padding:20px">
                <div style="font-size:3rem; margin-bottom:10px">🎯</div>
                <h2>Hoàn thành!</h2>
                <h1 style="color:var(--p); font-size:2.5rem; margin:10px 0">${score}/${originalQuizLength}</h1>
                <p style="color:#64748b">Bạn đã trả lời đúng ${(score/originalQuizLength*100).toFixed(1)}%</p>
                <div style="display:grid; gap:10px; margin-top:20px">
                    <button class="btn-p" style="padding:15px" onclick="startQuiz(curExIdx)">Làm lại</button>
                    <button class="btn-g" style="padding:15px" onclick="location.reload()">Trở về trang chủ</button>
                </div>
            </div>`;
    }

    function openSettings(i) { curExIdx = i; const s = exams[i].settings; document.getElementById('shufQ').checked = s.shufQ; document.getElementById('shufA').checked = s.shufA; document.getElementById('timeLimit').value = s.time; openPopup('setPopup'); }
    function applySettings() { exams[curExIdx].settings = { shufQ: document.getElementById('shufQ').checked, shufA: document.getElementById('shufA').checked, time: parseInt(document.getElementById('timeLimit').value)||0 }; sync(); closeAllPopups(); }
    function openRename(i) { curExIdx = i; document.getElementById('newNameInput').value = exams[i].name; openPopup('renamePopup'); }
    function confirmRename() { const val = document.getElementById('newNameInput').value.trim(); if(val) { exams[curExIdx].name = val; sync(); renderExams(); closeAllPopups(); } }
    function openDelete(i) { curExIdx = i; openPopup('deletePopup'); }
    function confirmDelete() { exams.splice(curExIdx, 1); sync(); renderExams(); closeAllPopups(); }

    document.getElementById('fileIn').onchange = e => {
        for(let f of e.target.files){
            const r = new FileReader();
            r.onload = ev => {
                try {
                    let imported = JSON.parse(ev.target.result);
                    imported = imported.map(q => ({
                        ...q,
                        options: q.options.map(o => typeof o === 'string' ? {text: o, image: ""} : o)
                    }));
                    exams.push({ name: f.name.replace('.json',''), questions: imported, settings: {shufQ:false, shufA:false, time:0} });
                    sync(); renderExams();
                } catch(e) { showAlert("Lỗi định dạng file!"); }
            };
            r.readAsText(f);
        }
    };

    function renderExams() {
        const grid = document.getElementById('examGrid');
        grid.innerHTML = exams.length ? "" : "<div style='grid-column:1/-1; text-align:center; padding:50px; color:#94a3b8'>Chưa có đề nào</div>";
        exams.forEach((ex, i) => {
            grid.innerHTML += `<div class="card">
                <div style="font-size:0.7rem; font-weight:800; color:var(--p); margin-bottom:5px">${ex.questions.length} CÂU</div>
                <b>${ex.name}</b>
                <div class="card-actions">
                    <button class="btn-start" onclick="startQuiz(${i})">Bắt đầu</button>
                    <button class="btn-func-edit" onclick="openEditor(${i})">Sửa</button>
                    <button class="btn-func-share" onclick="openShare(${i})">Chia sẻ</button>
                    <button class="btn-func-mode" onclick="openSettings(${i})">Chế Độ</button>
                    <button class="btn-func-name" onclick="openRename(${i})">Đổi Tên</button>
                    <button class="btn-func-json" onclick="exportExam(${i})">Xuất JSON</button>
                    <button class="btn-del" onclick="openDelete(${i})">Xóa</button>
                </div>
            </div>`;
        });
    }

    function uploadImg(input, optIdx) { 
        if (input.files[0]) { 
            const r = new FileReader(); 
            r.onload = e => { 
                if(optIdx === -1) {
                    currentDraft.questions[curQIdx].image = e.target.result; 
                } else {
                    currentDraft.questions[curQIdx].options[optIdx].image = e.target.result;
                }
                renderEditPage(); 
            }; 
            r.readAsDataURL(input.files[0]); 
        } 
    }
    load();
</script>
</body>
</html>
